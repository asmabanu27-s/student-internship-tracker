[build]
  command = "npm install --include=dev && npm --prefix backend install --omit=dev && npm --prefix frontend install --include=dev && npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true